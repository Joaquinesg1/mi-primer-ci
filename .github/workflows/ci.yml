name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-cov  # Asegúrate de instalar pytest y pytest-cov

    - name: Check PATH and pytest location
      run: |
        echo "Python Location: ${{ env.pythonLocation }}"
        echo "Current PATH: $PATH"
        which pytest
        find ${{ env.pythonLocation }} -name "pytest" -executable

    - name: Run tests with coverage (Explicitly add bin to PATH)
      run: |
        pythonLocation=$(echo "${{ env.pythonLocation }}")
        echo "Adding to PATH: $pythonLocation/bin"
        export PATH="$PATH:$pythonLocation/bin"
        echo "Updated PATH: $PATH"
        which pytest
        pytest --cov=. --cov-report=xml --cov-report=term
      shell: bash