name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-cov  # Asegúrate de instalar pytest y pytest-cov

    - name: Run tests with coverage (Direct path to pytest)
      run: |
        pythonLocation=$(echo "${{ env.pythonLocation }}")
        pytest_executable="$pythonLocation/bin/pytest"
        echo "Pytest executable path: $pytest_executable"
        if [ -f "$pytest_executable" ]; then
          echo "Pytest executable found."
          "$pytest_executable" --cov=. --cov-report=xml --cov-report=term
        else
          echo "Pytest executable NOT found at: $pytest_executable"
          exit 1
        fi
      shell: bash